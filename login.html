<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Talentvora | Login</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:linear-gradient(to right,#6A0DAD,#9B59B6);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
background:white;
width:400px;
padding:35px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.3);
}

h2{
text-align:center;
color:#6A0DAD;
margin-bottom:20px;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}

button{
width:100%;
padding:12px;
background:#6A0DAD;
color:white;
border:none;
border-radius:8px;
font-size:18px;
cursor:pointer;
margin-top:15px;
}

button:hover{
background:#4B0082;
}

.options{
display:flex;
justify-content:space-between;
margin-top:10px;
font-size:14px;
}

a{
color:#6A0DAD;
text-decoration:none;
font-weight:bold;
}

a:hover{
text-decoration:underline;
}

p{
text-align:center;
margin-top:20px;
}

</style>

<script>

function loginUser(){

let email=document.getElementById("email").value;
let password=document.getElementById("password").value;

if(email=="" || password==""){
alert("Please enter Email and Password");
return false;
}

alert("Login Successful!");

window.location.href="dashboard.html";

return false;

}

</script>

</head>

<body>

<div class="container">

<h2>Login to Talentvora</h2>

<form onsubmit="return loginUser()">

<input
type="email"
id="email"
placeholder="Enter Email"
required>

<input
type="password"
id="password"
placeholder="Enter Password"
required>

<div class="options">

<label>
<input type="checkbox">
Remember Me
</label>

<a href="#">Forgot Password?</a>

</div>

<button type="submit">Login</button>

</form>

<p>

Don't have an account?

<a href="register.html">Register</a>

</p>

</div>

</body>
</html>
