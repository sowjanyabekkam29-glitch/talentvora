<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TalentVora</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><text y=%27.9em%27 font-size=%2790%27>🌟</text></svg>">
<style>
:root{--bg:#eef5fb;--card:#fff;--tx:#0f1b2d;--mut:#5f7189;--bd:#d9e4f0;--a:#2563eb;--g:linear-gradient(135deg,#06b6d4,#3b82f6 55%,#8b5cf6);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1018;--card:#111b29;--tx:#eef4ff;--mut:#8fa3bd;--bd:#223249;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a1018;--card:#111b29;--tx:#eef4ff;--mut:#8fa3bd;--bd:#223249;color-scheme:dark}
:root[data-pal="sunset"]{--a:#f97316;--g:linear-gradient(135deg,#f59e0b,#ef4444 55%,#ec4899)}
:root[data-pal="forest"]{--a:#10b981;--g:linear-gradient(135deg,#84cc16,#10b981 55%,#14b8a6)}
:root[data-pal="royal"]{--a:#7c3aed;--g:linear-gradient(135deg,#7c3aed,#ec4899 55%,#f59e0b)}
:root[data-pal="rose"]{--a:#e11d48;--g:linear-gradient(135deg,#fb7185,#e11d48 55%,#9333ea)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.logo{font-weight:900;font-size:24px;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent;padding:6px 14px 18px}
nav{width:230px;padding:18px 10px;border-right:1px solid var(--bd);background:var(--card);display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100%}
nav button{display:flex;gap:12px;align-items:center;padding:11px 14px;border-radius:12px;text-align:left;font-weight:600;color:var(--mut)}
nav button:hover{background:var(--bg)}
nav button.on{background:var(--g);color:#fff}
main{flex:1;overflow-y:auto;height:100%;padding:20px}
.wrap{max-width:640px;margin:auto}
h2{font-size:22px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;margin-bottom:16px;overflow:hidden}
.pad{padding:14px}
.row{display:flex;align-items:center;gap:10px}
.av{width:42px;height:42px;border-radius:50%;background:var(--g);display:grid;place-items:center;font-size:20px;flex:none;border:2px solid var(--card);outline:2px solid var(--a);overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.stories{display:flex;gap:14px;overflow-x:auto;padding-bottom:12px;margin-bottom:6px}
.stories div{text-align:center;font-size:12px;color:var(--mut)}
.stories .av{width:60px;height:60px;font-size:28px;margin:0 auto 4px}
.media{aspect-ratio:1;display:grid;place-items:center;font-size:90px;position:relative}
.media img,.media video{width:100%;height:100%;object-fit:cover}
.media .aw{display:grid;gap:10px;place-items:center;width:100%}.media audio{width:90%}
.tag{position:absolute;left:12px;bottom:12px;background:#0007;color:#fff;font-size:12px;padding:4px 10px;border-radius:20px}
.act{display:flex;gap:6px;padding:8px 10px}
.act button{padding:6px 10px;border-radius:10px;color:var(--mut);font-weight:600}
.act button:hover,.act .liked{color:#ec4899}
.btn{background:var(--g);color:#fff;padding:10px 18px;border-radius:12px;font-weight:700}
.btn.alt{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
input,textarea,select{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);margin-bottom:10px}
.mut{color:var(--mut);font-size:13px}
.clips{height:calc(100vh - 40px);overflow-y:auto;scroll-snap-type:y mandatory;max-width:400px;margin:auto;border-radius:20px}
.clip{height:100%;scroll-snap-align:start;position:relative;display:grid;place-items:center;font-size:110px;color:#fff}
.clip .info{position:absolute;left:16px;right:70px;bottom:20px;font-size:15px}
.clip .side{position:absolute;right:12px;bottom:24px;display:flex;flex-direction:column;gap:14px;font-size:13px;text-align:center}
.clip .side button{color:#fff;font-size:26px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px}
.stat b{font-size:26px;display:block}
.up{color:#10b981;font-size:13px;font-weight:700}
video#cam{width:100%;border-radius:16px;background:#000;aspect-ratio:4/3;object-fit:cover}
.chat{display:grid;grid-template-columns:200px 1fr;height:60vh}
.chat .list{border-right:1px solid var(--bd);overflow-y:auto}
.chat .list button{display:flex;gap:8px;align-items:center;width:100%;padding:10px;text-align:left}
.chat .list .on{background:var(--bg)}
.msgs{display:flex;flex-direction:column;overflow-y:auto;flex:1;padding:12px;gap:8px}
.m{max-width:75%;padding:8px 12px;border-radius:16px;background:var(--bg)}
.m.me{align-self:flex-end;background:var(--g);color:#fff}
.modal{position:fixed;inset:0;background:#000a;display:none;place-items:center;z-index:9;padding:16px}
.modal.show{display:grid}
.modal .card{width:100%;max-width:420px;margin:0}
.bar{display:flex;align-items:flex-end;gap:10px;height:150px}
.bar div{flex:1;background:var(--g);border-radius:8px 8px 0 0;position:relative;min-height:6px}
.bar span{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-size:11px;color:var(--mut)}
.pill{height:8px;border-radius:8px;background:var(--bd);margin:4px 0 10px}.pill i{display:block;height:100%;border-radius:8px;background:var(--g)}
.badge{background:#ef4444;color:#fff;border-radius:10px;font-size:11px;padding:0 6px;margin-left:auto;font-style:normal}
nav button.on .badge{background:#fff;color:#ef4444}
.fab{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:14px;z-index:8;width:42px;height:42px;border-radius:50%;background:var(--g);color:#fff;font-size:20px;box-shadow:0 4px 14px #0004}
.story{position:fixed;inset:0;z-index:10;display:none;place-items:center;color:#fff;font-size:150px;text-align:center}
.story.show{display:grid}
.story .pg{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:14px;right:14px;height:4px;background:#fff5;border-radius:4px}
.story .pg i{display:block;height:100%;background:#fff;border-radius:4px;width:0}
.story .cap{position:absolute;bottom:40px;left:20px;right:20px;font-size:18px}
.story .x{position:absolute;top:calc(26px + env(safe-area-inset-top,0px));right:16px;font-size:26px;color:#fff}
.cmt{display:flex;gap:8px;margin-bottom:10px;font-size:14px}
.nt{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--bd)}
.nt.new{background:color-mix(in srgb,var(--a) 12%,transparent)}
.sw{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.sw button{width:44px;height:44px;border-radius:50%;border:3px solid var(--card);outline:2px solid var(--bd)}
.sw button.on{outline-color:var(--tx)}
.auth{position:fixed;inset:0;z-index:20;display:none;place-items:center;padding:16px;background:var(--g);overflow:auto}
.auth.show{display:grid}
.auth .card{width:100%;max-width:400px;padding:28px;margin:0}
.auth .logo{padding:0 0 4px;font-size:34px;text-align:center}
.tabs{display:flex;background:var(--bg);border-radius:12px;padding:4px;margin:16px 0}
.tabs button{flex:1;padding:8px;border-radius:9px;font-weight:700;color:var(--mut)}
.tabs button.on{background:var(--card);color:var(--tx);box-shadow:0 1px 4px #0002}
.pw{position:relative}.pw input{padding-right:64px}
.pw button{position:absolute;right:8px;top:7px;font-size:13px;font-weight:700;color:var(--a);padding:4px 8px}
.err{color:#ef4444;font-size:13px;min-height:18px;margin-bottom:8px}
@media(max-width:760px){
body{flex-direction:column-reverse}
nav{width:100%;height:auto;flex-direction:row;border:0;border-top:1px solid var(--bd);position:sticky;bottom:0;padding:4px;justify-content:space-around}
nav .logo{display:none}
nav button{flex-direction:column;gap:0;padding:6px;font-size:10px;border-radius:10px}
nav button span{font-size:20px}nav button{font-size:9px;min-width:0;text-align:center;line-height:1.1;position:relative}.badge{position:absolute;top:0;right:2px;margin:0}
main{padding:12px}
.chat{grid-template-columns:70px 1fr}.chat .list b{display:none}
.clips{height:calc(100vh - 150px)}
}
</style>
</head>

const SB=supabase.createClient("https://njafggwfyjhxyhmgkozd.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5qYWZnZ3dmeWpoeHlobWdrb3pkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI4MDkwNzIsImV4cCI6MjEwODM4NTA3Mn0.Dl7lv4bFyyOuVKXOtH5AJqX0x5fnUtQyVtKynuPn2oQ");

v.innerHTML=`<div class="stories"><div data-addst style="cursor:pointer"><div class="av" style="background:${G[0]}">➕</div>Your story</div>${ring.map(r=>`<div data-st="${r[0]}" style="cursor:pointer"><div class="av" style="background:${G[r[0]%5]}">${avt(r[1])}</div>${nm(r[1])}</div>`).join("")}</div>`+(d.length?d.map(card).join(""):empty("No talent shared yet. Be the first to share!"));wire();
v.querySelectorAll("[data-st]").forEach(b=>b.onclick=()=>story(+b.dataset.st));$("[data-addst]").onclick=()=>{defKind="story";go("share")}},

SB.removeAllChannels();SB.channel("tv").on("postgres_changes",{event:"INSERT",schema:"public",table:"notifications",filter:"user_id=eq."+U.id},()=>{unread();if(view==="buzz")R.buzz()}).on("postgres_changes",{event:"INSERT",schema:"public",table:"messages",filter:"recipient_id=eq."+U.id},m=>{if(view==="chat"&&peer===m.new.sender_id)msgs()}).subscribe();unread()}catch(e){console.error(e)}
$("#auth").classList.remove("show");go("show")}
function stop(){U=null;P=null;peer=null;SB.removeAllChannels();$("#af").reset();document.querySelectorAll("[data-eye]").forEach(b=>{$("#"+b.dataset.eye).type="password";b.textContent="Show"});amode("in");v.innerHTML="";$("#auth").classList.add("show")}
SB.auth.onAuthStateChange(async(ev,s)=>{if(ev==="SIGNED_OUT")stop();else if(ev==="PASSWORD_RECOVERY"){const p=prompt("Enter your new password (8+ characters)");if(p&&p.length>=8){const r=await SB.auth.updateUser({password:p});alert(r.error?r.error.message:"Password updated.")}}if(s&&s.user&&ev!=="SIGNED_OUT")setTimeout(()=>start(s.user),0)});
/* themes */
const PAL=[["ocean","linear-gradient(135deg,#06b6d4,#3b82f6 55%,#8b5cf6)"],["sunset","linear-gradient(135deg,#f59e0b,#ef4444 55%,#ec4899)"],["forest","linear-gradient(135deg,#84cc16,#10b981 55%,#14b8a6)"],["royal","linear-gradient(135deg,#7c3aed,#ec4899 55%,#f59e0b)"],["rose","linear-gradient(135deg,#fb7185,#e11d48 55%,#9333ea)"]];
let T=["ocean","auto"];try{T=JSON.parse(localStorage.getItem("tv_th"))||T}catch(e){}
function theme(){const r=document.documentElement;r.dataset.pal=T[0];if(T[1]==="auto")r.removeAttribute("data-theme");else r.dataset.theme=T[1];try{localStorage.setItem("tv_th",JSON.stringify(T))}catch(e){}$("#sw").querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.p===T[0]))}
PAL.forEach(p=>{const b=document.createElement("button");b.dataset.p=p[0];b.title=p[0];b.style.background=p[1];b.onclick=()=>{T[0]=p[0];theme()};$("#sw").appendChild(b)});
document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{T[1]=b.dataset.m;theme()});
$("#tb").onclick=()=>$("#th").classList.add("show");$("#tc").onclick=()=>$("#th").classList.remove("show");
theme();
</script>
