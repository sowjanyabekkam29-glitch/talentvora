<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TalentVora</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><text y=%27.9em%27 font-size=%2790%27>🌟</text></svg>">
<style>
:root{--bg:#eef5fb;--card:#fff;--tx:#0f1b2d;--mut:#5f7189;--bd:#d9e4f0;--a:#2563eb;--g:linear-gradient(135deg,#06b6d4,#3b82f6 55%,#8b5cf6);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1018;--card:#111b29;--tx:#eef4ff;--mut:#8fa3bd;--bd:#223249;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a1018;--card:#111b29;--tx:#eef4ff;--mut:#8fa3bd;--bd:#223249;color-scheme:dark}
:root[data-pal="sunset"]{--a:#f97316;--g:linear-gradient(135deg,#f59e0b,#ef4444 55%,#ec4899)}
:root[data-pal="forest"]{--a:#10b981;--g:linear-gradient(135deg,#84cc16,#10b981 55%,#14b8a6)}
:root[data-pal="royal"]{--a:#7c3aed;--g:linear-gradient(135deg,#7c3aed,#ec4899 55%,#f59e0b)}
:root[data-pal="rose"]{--a:#e11d48;--g:linear-gradient(135deg,#fb7185,#e11d48 55%,#9333ea)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.logo{font-weight:900;font-size:24px;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent;padding:6px 14px 18px}
nav{width:230px;padding:18px 10px;border-right:1px solid var(--bd);background:var(--card);display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100%}
nav button{display:flex;gap:12px;align-items:center;padding:11px 14px;border-radius:12px;text-align:left;font-weight:600;color:var(--mut)}
nav button:hover{background:var(--bg)}
nav button.on{background:var(--g);color:#fff}
main{flex:1;overflow-y:auto;height:100%;padding:20px}
.wrap{max-width:640px;margin:auto}
h2{font-size:22px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;margin-bottom:16px;overflow:hidden}
.pad{padding:14px}
.row{display:flex;align-items:center;gap:10px}
.av{width:42px;height:42px;border-radius:50%;background:var(--g);display:grid;place-items:center;font-size:20px;flex:none;border:2px solid var(--card);outline:2px solid var(--a)}
.stories{display:flex;gap:14px;overflow-x:auto;padding-bottom:12px;margin-bottom:6px}
.stories div{text-align:center;font-size:12px;color:var(--mut)}
.stories .av{width:60px;height:60px;font-size:28px;margin:0 auto 4px}
.media{aspect-ratio:1;display:grid;place-items:center;font-size:90px;position:relative}
.media img,.media video{width:100%;height:100%;object-fit:cover}
.tag{position:absolute;left:12px;bottom:12px;background:#0007;color:#fff;font-size:12px;padding:4px 10px;border-radius:20px}
.act{display:flex;gap:6px;padding:8px 10px}
.act button{padding:6px 10px;border-radius:10px;color:var(--mut);font-weight:600}
.act button:hover,.act .liked{color:#ec4899}
.btn{background:var(--g);color:#fff;padding:10px 18px;border-radius:12px;font-weight:700}
.btn.alt{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
input,textarea,select{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);margin-bottom:10px}
.mut{color:var(--mut);font-size:13px}
.clips{height:calc(100vh - 40px);overflow-y:auto;scroll-snap-type:y mandatory;max-width:400px;margin:auto;border-radius:20px}
.clip{height:100%;scroll-snap-align:start;position:relative;display:grid;place-items:center;font-size:110px;color:#fff}
.clip .info{position:absolute;left:16px;right:70px;bottom:20px;font-size:15px}
.clip .side{position:absolute;right:12px;bottom:24px;display:flex;flex-direction:column;gap:14px;font-size:13px;text-align:center}
.clip .side button{color:#fff;font-size:26px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px}
.stat b{font-size:26px;display:block}
.up{color:#10b981;font-size:13px;font-weight:700}
video#cam{width:100%;border-radius:16px;background:#000;aspect-ratio:4/3;object-fit:cover}
.chat{display:grid;grid-template-columns:200px 1fr;height:60vh}
.chat .list{border-right:1px solid var(--bd);overflow-y:auto}
.chat .list button{display:flex;gap:8px;align-items:center;width:100%;padding:10px;text-align:left}
.chat .list .on{background:var(--bg)}
.msgs{display:flex;flex-direction:column;overflow-y:auto;flex:1;padding:12px;gap:8px}
.m{max-width:75%;padding:8px 12px;border-radius:16px;background:var(--bg)}
.m.me{align-self:flex-end;background:var(--g);color:#fff}
.modal{position:fixed;inset:0;background:#000a;display:none;place-items:center;z-index:9;padding:16px}
.modal.show{display:grid}
.modal .card{width:100%;max-width:420px;margin:0}
.bar{display:flex;align-items:flex-end;gap:10px;height:150px}
.bar div{flex:1;background:var(--g);border-radius:8px 8px 0 0;position:relative;min-height:6px}
.bar span{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-size:11px;color:var(--mut)}
.pill{height:8px;border-radius:8px;background:var(--bd);margin:4px 0 10px}.pill i{display:block;height:100%;border-radius:8px;background:var(--g)}
.badge{background:#ef4444;color:#fff;border-radius:10px;font-size:11px;padding:0 6px;margin-left:auto;font-style:normal}
nav button.on .badge{background:#fff;color:#ef4444}
.fab{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:14px;z-index:8;width:42px;height:42px;border-radius:50%;background:var(--g);color:#fff;font-size:20px;box-shadow:0 4px 14px #0004}
.story{position:fixed;inset:0;z-index:10;display:none;place-items:center;color:#fff;font-size:150px;text-align:center}
.story.show{display:grid}
.story .pg{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:14px;right:14px;height:4px;background:#fff5;border-radius:4px}
.story .pg i{display:block;height:100%;background:#fff;border-radius:4px;width:0}
.story .cap{position:absolute;bottom:40px;left:20px;right:20px;font-size:18px}
.story .x{position:absolute;top:calc(26px + env(safe-area-inset-top,0px));right:16px;font-size:26px;color:#fff}
.cmt{display:flex;gap:8px;margin-bottom:10px;font-size:14px}
.nt{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--bd)}
.nt.new{background:color-mix(in srgb,var(--a) 12%,transparent)}
.sw{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.sw button{width:44px;height:44px;border-radius:50%;border:3px solid var(--card);outline:2px solid var(--bd)}
.sw button.on{outline-color:var(--tx)}
.auth{position:fixed;inset:0;z-index:20;display:none;place-items:center;padding:16px;background:var(--g);overflow:auto}
.auth.show{display:grid}
.auth .card{width:100%;max-width:400px;padding:28px;margin:0}
.auth .logo{padding:0 0 4px;font-size:34px;text-align:center}
.tabs{display:flex;background:var(--bg);border-radius:12px;padding:4px;margin:16px 0}
.tabs button{flex:1;padding:8px;border-radius:9px;font-weight:700;color:var(--mut)}
.tabs button.on{background:var(--card);color:var(--tx);box-shadow:0 1px 4px #0002}
.pw{position:relative}.pw input{padding-right:64px}
.pw button{position:absolute;right:8px;top:7px;font-size:13px;font-weight:700;color:var(--a);padding:4px 8px}
.emp{position:fixed;left:12px;right:12px;bottom:80px;max-width:420px;margin:auto;z-index:25;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:10px;display:none;grid-template-columns:repeat(8,1fr);gap:2px;max-height:40vh;overflow:auto;box-shadow:0 8px 30px #0005}
.emp.show{display:grid}
.emp button{font-size:24px;padding:4px;border-radius:8px}
.emp button:hover{background:var(--bg)}
.emb{font-size:22px;padding:0 8px;flex:none}
.tg{color:var(--a);cursor:pointer;font-weight:600}
.mus{margin:0 10px;padding:4px 12px;border-radius:20px;background:var(--bg);font-weight:600;font-size:13px;color:var(--mut)}
.mus.on{background:var(--g);color:#fff}
.cb{display:flex;flex-direction:column;height:calc(100vh - 110px);min-height:340px}
@media(max-width:760px){nav{justify-content:flex-start;overflow-x:auto}nav button{flex:none;min-width:64px}.cb{height:calc(100dvh - 190px)}}
.av{overflow:hidden}.av img{width:100%;height:100%;object-fit:cover;display:block}
.err{color:#ef4444;font-size:13px;min-height:18px;margin-bottom:8px}
@media(max-width:760px){
body{flex-direction:column-reverse}
nav{width:100%;height:auto;flex-direction:row;border:0;border-top:1px solid var(--bd);position:sticky;bottom:0;padding:4px;justify-content:space-around}
nav .logo{display:none}
nav button{flex-direction:column;gap:0;padding:6px;font-size:10px;border-radius:10px}
nav button span{font-size:20px}nav button{font-size:9px;min-width:0;text-align:center;line-height:1.1;position:relative}.badge{position:absolute;top:0;right:2px;margin:0}
main{padding:12px}
.chat{grid-template-columns:70px 1fr}.chat .list b{display:none}
.clips{height:calc(100vh - 150px)}
}
</style>
</head>
<body>
<nav id="nav"><div class="logo">TalentVora</div></nav>
<main><div class="wrap" id="v"></div></main>

<div class="auth show" id="auth"><div class="card"><div class="logo">TalentVora</div><p class="mut" style="text-align:center">Show your talent. Gather your supporters.</p>
<div class="tabs"><button id="tl" class="on" type="button">Log in</button><button id="ts" type="button">Sign up</button></div>
<form id="af" novalidate>
<input id="ae" type="email" placeholder="Email address" autocomplete="email">
<div class="pw"><input id="ap" type="password" placeholder="Password" autocomplete="current-password"><button type="button" data-eye="ap">Show</button></div>
<div class="pw" id="cw" style="display:none"><input id="ac" type="password" placeholder="Confirm password" autocomplete="new-password"><button type="button" data-eye="ac">Show</button></div>
<div class="err" id="ar"></div>
<button class="btn" style="width:100%" id="ab">Log in</button></form>
<p style="text-align:center;margin-top:12px"><button class="mut" id="fg" type="button" style="text-decoration:underline">Forgot password?</button></p></div></div>

<div class="story" id="story"></div>
<button class="fab" id="tb" aria-label="Themes">🎨</button>
<div class="modal" id="ed"><div class="card pad"><h2>Edit My Stage</h2>
<input id="en" placeholder="Display name"><input id="eh" placeholder="username (letters, numbers, _)"><div class="row" style="margin-bottom:10px;flex-wrap:wrap"><div class="av" id="ev" style="width:64px;height:64px;font-size:30px">🌟</div><button type="button" class="btn alt" id="eu">📷 Upload photo</button><button type="button" class="btn alt" id="ep">Choose emoji</button><button type="button" class="btn alt" id="er" style="display:none">Remove photo</button></div><input id="ef" type="file" accept="image/*" style="display:none"><input id="ee" type="hidden"><select id="ec"><option>Music</option><option>Dance</option><option>Art</option><option>Comedy</option><option>Sports</option><option>Cooking</option></select><textarea id="eb" rows="3" placeholder="Your story"></textarea><button type="button" class="btn alt" data-em="eb" style="margin-bottom:10px">😊 Add emoji</button>
<div class="err" id="ex"></div><div class="row"><button class="btn" id="sv">Save</button><button class="btn alt" id="cx">Cancel</button></div></div></div>
<div class="modal" id="cmm"><div class="card pad"><h2>Comments</h2><div id="cl" style="max-height:40vh;overflow:auto;margin-bottom:10px"></div><div class="row"><input id="ci" placeholder="Add a comment…" style="margin:0"><button type="button" class="emb" data-em="ci" aria-label="Emoji">😊</button><button class="btn" id="cs2">Post</button></div><button class="btn alt" id="cc" style="margin-top:10px">Close</button></div></div>
<div class="modal" id="th"><div class="card pad"><h2>🎨 Themes</h2><p class="mut" style="margin-bottom:8px">Colour palette</p><div class="sw" id="sw"></div><p class="mut" style="margin-bottom:8px">Mode</p><div class="row" style="margin-bottom:14px"><button class="btn alt" data-m="auto">Auto</button><button class="btn alt" data-m="light">☀️ Light</button><button class="btn alt" data-m="dark">🌙 Dark</button></div><button class="btn" id="tc">Done</button></div></div>

<div class="modal" id="pe"><div class="card pad"><h2>Edit post</h2><textarea id="pc" rows="3" placeholder="Caption"></textarea><button type="button" class="btn alt" data-em="pc" style="margin-bottom:10px">😊 Add emoji</button><select id="pk"></select><div class="err" id="px"></div><div class="row"><button class="btn" id="ps">Save</button><button class="btn alt" id="pcx">Cancel</button></div></div></div>
<div class="emp" id="emp"></div>
<div id="dbg" style="position:fixed;z-index:30;left:12px;right:12px;bottom:70px;background:#b91c1c;color:#fff;padding:8px 12px;border-radius:10px;font-size:13px;display:none"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
if(!window.supabase){document.body.insertAdjacentHTML("afterbegin",'<p style="position:fixed;z-index:40;left:12px;right:12px;bottom:12px;background:#b91c1c;color:#fff;padding:10px;border-radius:10px">Couldn’t load the Supabase library. Check your internet connection and open this file in a normal browser tab.</p>')}
const SB=supabase.createClient("https://njafggwfyjhxyhmgkozd.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5qYWZnZ3dmeWpoeHlobWdrb3pkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI4MDkwNzIsImV4cCI6MjEwODM4NTA3Mn0.Dl7lv4bFyyOuVKXOtH5AJqX0x5fnUtQyVtKynuPn2oQ");
const $=s=>document.querySelector(s),v=$("#v");
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nm=p=>esc(p&&(p.display_name||p.username)||"Talent");
const G=["linear-gradient(135deg,#7c3aed,#ec4899)","linear-gradient(135deg,#f59e0b,#ef4444)","linear-gradient(135deg,#06b6d4,#7c3aed)","linear-gradient(135deg,#10b981,#06b6d4)","linear-gradient(135deg,#ec4899,#f59e0b)"];
const pages=[["show","🏠","Showcase"],["search","🔍","Search"],["clips","🎬","Talent Clips"],["cap","📸","Capture"],["chat","💬","Talk Hub"],["buzz","🔔","Pulse"],["ins","📊","Insights"],["me","🌟","My Stage"]];
const AU={},PD={},H={count:"exact",head:true};
let U=null,P=null,view="show",peer=null,sup=new Set(),cp=0,mode="in";
pages.forEach(p=>{const b=document.createElement("button");b.dataset.p=p[0];b.innerHTML=`<span>${p[1]}</span>${p[2]}${p[0]==="buzz"?'<i class="badge" id="bd"></i>':""}`;b.onclick=()=>{hist=[];curv=null;go(p[0])};$("#nav").appendChild(b)});
let hist=[],curv=null;
function go(p,a,isBack){stopCam();if(!isBack&&curv&&!(curv[0]===p&&curv[1]===a)){hist.push(curv);if(hist.length>25)hist.shift()}curv=[p,a];view=p;peer=p==="chat"&&a?a:null;const tab={post:"show",mem:"cap",user:""}[p];$("#nav").querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.p===(tab===undefined?p:tab)));v.innerHTML='<p class="mut">Loading…</p>';Promise.resolve().then(()=>R[p](a)).catch(e=>{v.innerHTML=`<div class="card pad">Couldn’t load this page: ${esc(e.message||e)}<br><br><button class="btn" onclick="refresh()">Try again</button></div>`});$("main").scrollTop=0}
function back(){const h=hist.pop();if(h)go(h[0],h[1],true);else go("show",undefined,true)}
function refresh(){go(curv[0],curv[1],true)}
async function notify(uid,type,body,post){if(uid&&uid!==U.id)await SB.from("notifications").insert({user_id:uid,actor_id:U.id,type,post_id:post||null,body})}
async function unread(){const r=await SB.from("notifications").select("*",H).eq("user_id",U.id).eq("is_read",false),b=$("#bd"),c=r.count||0;b.textContent=c;b.style.display=c?"":"none"}
async function fetchAll(mk){let out=[],i=0;for(;;){const r=await mk().range(i,i+999);if(r.error)throw r.error;const d=r.data||[];out=out.concat(d);if(d.length<1000)break;i+=1000}return out}
async function posts(kind){const d=await fetchAll(()=>{const q=SB.from("posts").select("*,profiles(id,username,display_name,avatar_emoji,avatar_url),cheers(user_id),comments(id)").order("created_at",{ascending:false});return kind?q.eq("kind",kind):q.neq("kind","story")});d.forEach(p=>{AU[p.id]=p.author_id;PD[p.id]=p});return d}
const med=p=>p.media_url?(/\.(mp4|webm|mov)(\?|$)/i.test(p.media_url)?`<video src="${esc(p.media_url)}" controls playsinline></video>`:`<img src="${esc(p.media_url)}" alt="">`):esc((p.profiles&&p.profiles.avatar_emoji)||"🌟");
const supBtn=id=>`<button class="btn alt" data-sup="${id}">${sup.has(id)?"Supporting ✓":"Support"}</button>`;
function lin(t){return esc(t).replace(/(?<![&\w])#(\w+)/g,'<span class="tg" data-tag="$1">#$1</span>')}
function ago(t){const s=(Date.now()-new Date(t))/1000;return s<60?"now":s<3600?Math.floor(s/60)+"m":s<86400?Math.floor(s/3600)+"h":Math.floor(s/86400)+"d"}
function card(p){const a=p.profiles||{},mine=p.cheers.some(c=>c.user_id===U.id),own=a.id===U.id,vid=/\.(mp4|webm|mov)(\?|$)/i.test(p.media_url||"");return`<div class="card"><div class="row pad"><div class="row" data-user="${a.id}" style="cursor:pointer;flex:1;min-width:0"><div class="av">${ai(a)}</div><div><b>${nm(a)}</b><div class="mut">@${esc(a.username)} · ${esc(p.category||"")} · ${ago(p.created_at)}</div></div></div>${own?`<button class="btn alt" data-edit="${p.id}">✏️</button><button class="btn alt" data-del="${p.id}">🗑</button>`:supBtn(a.id)}</div><div class="media" ${vid?"":`data-post="${p.id}"`} style="background:${G[p.id%5]};${vid?"":"cursor:pointer"}">${med(p)}</div><div class="act"><button data-ch="${p.id}" class="${mine?"liked":""}">${mine?"💖":"🤍"} ${p.cheers.length}</button><button data-cm="${p.id}">💬 ${p.comments.length}</button></div><div class="pad" style="padding-top:0"><b data-user="${a.id}" style="cursor:pointer">${nm(a)}</b> ${lin(p.caption)}</div></div>`}
function wire(){
v.querySelectorAll("[data-ch]").forEach(b=>b.onclick=async()=>{const id=+b.dataset.ch;if(b.classList.contains("liked"))await SB.from("cheers").delete().match({post_id:id,user_id:U.id});else{await SB.from("cheers").insert({post_id:id,user_id:U.id});await notify(AU[id],"cheer","cheered your talent",id)}refresh()});
v.querySelectorAll("[data-cm]").forEach(b=>b.onclick=()=>go("post",+b.dataset.cm));
v.querySelectorAll("[data-sup]").forEach(b=>b.onclick=async()=>{const id=b.dataset.sup;if(sup.has(id)){await SB.from("supporters").delete().match({supporter_id:U.id,creator_id:id});sup.delete(id)}else{await SB.from("supporters").insert({supporter_id:U.id,creator_id:id});sup.add(id);await notify(id,"supporter","is now supporting you")}refresh()});
v.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{const p=PD[+b.dataset.edit];peid=p.id;$("#pc").value=p.caption||"";$("#pk").value=p.category||"Music";$("#px").textContent="";$("#pe").classList.add("show")});
v.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{if(!confirm("Delete this post?"))return;const p=PD[+b.dataset.del];await SB.from("posts").delete().eq("id",p.id);const m=(p.media_url||"").split("/media/")[1];if(m)await SB.storage.from("media").remove([decodeURIComponent(m.split("?")[0])]);if(view==="post")back();else refresh()})}
async function cmts(id){cp=id;const r=await SB.from("comments").select("body,profiles(username,display_name,avatar_emoji,avatar_url)").eq("post_id",id).order("created_at");$("#cl").innerHTML=(r.data||[]).map(c=>`<div class="cmt"><div class="av" style="width:30px;height:30px;font-size:14px">${ai(c.profiles)}</div><div><b>${nm(c.profiles)}</b> ${esc(c.body)}</div></div>`).join("")||'<p class="mut">Be the first to comment.</p>';$("#cmm").classList.add("show")}
$("#cs2").onclick=async()=>{const t=$("#ci").value.trim();if(!t)return;$("#ci").value="";const r=await SB.from("comments").insert({post_id:cp,author_id:U.id,body:t});if(!r.error)await notify(AU[cp],"comment","commented: "+t.slice(0,60),cp);cmts(cp)};

$("#ef").onchange=e=>{const f=e.target.files[0];if(!f)return;if(f.size>5e6){$("#ex").textContent="Photo must be under 5 MB.";return}$("#ex").textContent="";ph=f;rm=false;evShow()};
$("#er").onclick=()=>{ph=null;rm=true;$("#ef").value="";evShow()};
async function userPosts(id){const d=await fetchAll(()=>SB.from("posts").select(SEL).eq("author_id",id).neq("kind","story").order("created_at",{ascending:false}));d.forEach(p=>{AU[p.id]=p.author_id;PD[p.id]=p});return d}
function grid(l){return l.length?`<div class="grid3">${l.map(p=>`<div class="media card" data-post="${p.id}" style="background:${G[p.id%5]};font-size:44px;margin:0;cursor:pointer">${p.media_url&&!/\.(mp4|webm|mov)(\?|$)/i.test(p.media_url)?`<img src="${esc(p.media_url)}" alt="">`:p.media_url?"🎬":esc((p.profiles&&p.profiles.avatar_emoji)||"🌟")}</div>`).join("")}</div>`:empty("No posts yet.")}
function prow(p){return`<div class="card pad row" data-user="${p.id}" style="cursor:pointer"><div class="av">${ai(p)}</div><div style="flex:1"><b>${nm(p)}</b><div class="mut">@${esc(p.username)} · ${esc(p.category||"")}</div></div>${p.id!==U.id?supBtn(p.id):""}</div>`}
document.addEventListener("click",e=>{const t=e.target;if(t.closest("button,video,input,textarea,select,#emp"))return;const o=t.closest("[data-user],[data-post],[data-tag],[data-chat]");if(!o)return;if(o.dataset.user)go("user",o.dataset.user);else if(o.dataset.post)go("post",+o.dataset.post);else if(o.dataset.tag)go("search","#"+o.dataset.tag);else if(o.dataset.chat)go("chat",o.dataset.chat)});
async function msgs(){const el=$("#ms");if(!el||!peer)return;const r=await SB.from("messages").select("*").or(`and(sender_id.eq.${U.id},recipient_id.eq.${peer}),and(sender_id.eq.${peer},recipient_id.eq.${U.id})`).order("created_at").limit(100),d=r.data||[],lm=[...d].reverse().find(m=>m.sender_id===U.id);el.innerHTML=d.map(m=>`<div class="m ${m.sender_id===U.id?"me":""}" title="${new Date(m.created_at).toLocaleString()}">${esc(m.body)}</div>${lm&&m.id===lm.id&&m.is_read?'<div class="mut" style="align-self:flex-end;font-size:11px">Seen</div>':""}`).join("")||'<p class="mut">Say hello 👋</p>';el.scrollTop=el.scrollHeight;await SB.from("messages").update({is_read:true}).eq("recipient_id",U.id).eq("sender_id",peer).eq("is_read",false)}
$("#cx").onclick=()=>$("#ed").classList.remove("show");
$("#sv").onclick=async()=>{const u=$("#eh").value.trim().toLowerCase();if(!/^\w{3,30}$/.test(u)){$("#ex").textContent="Username: 3–30 letters, numbers or _.";return}const oldUrl=P.avatar_url||null;let au=oldUrl;if(ph){const ext=((ph.type.split("/")[1]||"jpg").replace("jpeg","jpg")),path=`${U.id}/avatar_${Date.now()}.${ext}`,up=await SB.storage.from("media").upload(path,ph,{contentType:ph.type});if(up.error){$("#ex").textContent=up.error.message;return}au=SB.storage.from("media").getPublicUrl(path).data.publicUrl}else if(rm)au=null;
const r=await SB.from("profiles").update({avatar_url:au,display_name:$("#en").value,username:u,avatar_emoji:$("#ee").value||"🌟",category:$("#ec").value,bio:$("#eb").value}).eq("id",U.id).select().single();if(r.error){$("#ex").textContent=r.error.code==="23505"?"That username is taken.":r.error.message;return}P=r.data;const old=(oldUrl||"").split("/media/")[1];if(old&&au!==oldUrl)await SB.storage.from("media").remove([decodeURIComponent(old.split("?")[0])]);ph=null;rm=false;$("#ed").classList.remove("show");R.me()};
const EM="😀😁😂🤣😊😍🥰😘😎🤩🥳😇🤗🤔😴😭😤😱🙌👏🙏💪👍👎✌️🤝🔥✨⭐🌟💫🎉🎊🎁🏆🥇🎯❤️🧡💛💚💙💜🖤💖💯🎤🎧🎵🎶🎸🎹🥁🎻🎺🎬📸🎥🎨🖌️🎭🩰💃🕺🏀⚽🏏🏐🥊🏋️🏊🧘🍳🍕🍔🍜🍰☕🌍🌈🌸🚀📚✍️🎮🐯🦋🌞🌙".match(/\p{Extended_Pictographic}(?:\uFE0F|\u200D\p{Extended_Pictographic})*/gu);
function emo(fn){const p=$("#emp");p.innerHTML=EM.map(e=>`<button type="button">${e}</button>`).join("");p.querySelectorAll("button").forEach(b=>b.onclick=()=>fn(b.textContent));p.classList.add("show")}
function ins(el,t){const a=el.selectionStart==null?el.value.length:el.selectionStart,b=el.selectionEnd==null?a:el.selectionEnd;el.value=el.value.slice(0,a)+t+el.value.slice(b);el.focus();const c=a+t.length;el.setSelectionRange(c,c)}
document.addEventListener("click",e=>{if(e.target.closest("#ep")){emo(t=>{$("#ee").value=t;ph=null;rm=true;evShow();$("#emp").classList.remove("show")});return}const b=e.target.closest("[data-em]");if(b){const el=$("#"+b.dataset.em);emo(t=>ins(el,t));return}if(!e.target.closest("#emp"))$("#emp").classList.remove("show")});
function toast(t){const d=$("#dbg");d.textContent=t;d.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>d.style.display="none",8000)}
addEventListener("unhandledrejection",e=>toast("Something went wrong: "+((e.reason&&e.reason.message)||e.reason)));
addEventListener("error",e=>toast("Something went wrong: "+e.message));
/* auth */
function amode(m){mode=m;$("#tl").classList.toggle("on",m==="in");$("#ts").classList.toggle("on",m==="up");$("#cw").style.display=m==="up"?"":"none";$("#ab").textContent=m==="in"?"Log in":"Create account";$("#ar").textContent="";$("#ap").autocomplete=m==="in"?"current-password":"new-password"}
$("#tl").onclick=()=>amode("in");$("#ts").onclick=()=>amode("up");
document.querySelectorAll("[data-eye]").forEach(b=>b.onclick=()=>{const i=$("#"+b.dataset.eye),s=i.type==="password";i.type=s?"text":"password";b.textContent=s?"Hide":"Show"});
const say=(t,ok)=>{const r=$("#ar");r.textContent=t;r.style.color=ok?"#10b981":""};
const site=location.href.split("#")[0];
$("#af").onsubmit=async e=>{e.preventDefault();const em=$("#ae").value.trim().toLowerCase(),pw=$("#ap").value;
if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em))return say("Enter a valid email address.");
if(pw.length<8)return say("Password must be at least 8 characters.");
if(mode==="up"){if(pw!==$("#ac").value)return say("Passwords don’t match.");const r=await SB.auth.signUp({email:em,password:pw,options:{emailRedirectTo:site}});if(r.error)return say(r.error.message);if(!r.data.session)return say("Check your email and confirm your address, then log in.",1);start(r.data.user)}
else{const r=await SB.auth.signInWithPassword({email:em,password:pw});if(r.error)return say(r.error.message);start(r.data.user)}};
$("#fg").onclick=async()=>{const em=$("#ae").value.trim().toLowerCase();if(!em)return say("Type your email above first.");const r=await SB.auth.resetPasswordForEmail(em,{redirectTo:site});say(r.error?r.error.message:"Password reset link sent. Check your email.",!r.error)};
async function start(u){if(U&&U.id===u.id)return;U=u;P={username:"talent",category:"Music"};
try{const r=await SB.from("profiles").select("*").eq("id",u.id).maybeSingle();if(r.data)P=r.data;const s=await SB.from("supporters").select("creator_id").eq("supporter_id",U.id);sup=new Set((s.data||[]).map(x=>x.creator_id));
SB.removeAllChannels();SB.channel("tv").on("postgres_changes",{event:"INSERT",schema:"public",table:"notifications",filter:"user_id=eq."+U.id},()=>{unread();if(view==="buzz")R.buzz()}).on("postgres_changes",{event:"INSERT",schema:"public",table:"messages",filter:"recipient_id=eq."+U.id},m=>{if(view==="chat"){if(peer===m.new.sender_id)msgs();else if(!peer)R.inbox()}}).subscribe();unread()}catch(e){console.error(e)}
$("#auth").classList.remove("show");go("show")}
function stop(){U=null;P=null;peer=null;SB.removeAllChannels();$("#af").reset();document.querySelectorAll("[data-eye]").forEach(b=>{$("#"+b.dataset.eye).type="password";b.textContent="Show"});amode("in");v.innerHTML="";$("#auth").classList.add("show")}
SB.auth.onAuthStateChange(async(ev,s)=>{if(ev==="SIGNED_OUT")stop();else if(ev==="PASSWORD_RECOVERY"){const p=prompt("Enter your new password (8+ characters)");if(p&&p.length>=8){const r=await SB.auth.updateUser({password:p});alert(r.error?r.error.message:"Password updated.")}}if(s&&s.user&&ev!=="SIGNED_OUT")setTimeout(()=>start(s.user),0)});
/* themes */
const PAL=[["ocean","linear-gradient(135deg,#06b6d4,#3b82f6 55%,#8b5cf6)"],["sunset","linear-gradient(135deg,#f59e0b,#ef4444 55%,#ec4899)"],["forest","linear-gradient(135deg,#84cc16,#10b981 55%,#14b8a6)"],["royal","linear-gradient(135deg,#7c3aed,#ec4899 55%,#f59e0b)"],["rose","linear-gradient(135deg,#fb7185,#e11d48 55%,#9333ea)"]];
let T=["ocean","auto"];try{T=JSON.parse(localStorage.getItem("tv_th"))||T}catch(e){}
function theme(){const r=document.documentElement;r.dataset.pal=T[0];if(T[1]==="auto")r.removeAttribute("data-theme");else r.dataset.theme=T[1];try{localStorage.setItem("tv_th",JSON.stringify(T))}catch(e){}$("#sw").querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.p===T[0]))}
PAL.forEach(p=>{const b=document.createElement("button");b.dataset.p=p[0];b.title=p[0];b.style.background=p[1];b.onclick=()=>{T[0]=p[0];theme()};$("#sw").appendChild(b)});
document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{T[1]=b.dataset.m;theme()});
$("#tb").onclick=()=>$("#th").classList.add("show");$("#tc").onclick=()=>$("#th").classList.remove("show");
theme();
