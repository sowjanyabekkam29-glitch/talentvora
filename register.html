<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Talentvora | Register</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif;}
body{background:linear-gradient(to right,#6A0DAD,#9B59B6);display:flex;justify-content:center;align-items:center;height:100vh;}
.container{background:white;width:420px;padding:35px;border-radius:15px;box-shadow:0 5px 15px rgba(0,0,0,.3);}
h2{text-align:center;color:#6A0DAD;margin-bottom:20px;}
input{width:100%;padding:12px;margin:10px 0;border:1px solid #ccc;border-radius:8px;font-size:16px;}
button{width:100%;padding:12px;background:#6A0DAD;color:white;border:none;border-radius:8px;font-size:18px;cursor:pointer;margin-top:15px;}
button:hover{background:#4B0082;}
button:disabled{opacity:.6;cursor:wait;}
p{text-align:center;margin-top:20px;}
#msg{color:#c0392b;font-size:14px;margin-top:10px;text-align:center;}
a{color:#6A0DAD;font-weight:bold;text-decoration:none;}
a:hover{text-decoration:underline;}

.pw{
position:relative;
margin:10px 0;
}

.pw input{
margin:0;
padding-right:50px;
}

.pw .eye{
position:absolute;
right:6px;
top:50%;
transform:translateY(-50%);
width:auto;
margin:0;
padding:6px 10px;
background:transparent;
color:#6A0DAD;
font-size:18px;
border:none;
}

.pw .eye:hover{
background:transparent;
}

</style>
</head>
<body>
<div class="container">
<h2>Create Account</h2>
<form id="regForm">
<input type="text" id="fullName" placeholder="Full Name" required pattern="[A-Za-z ]+" title="Name should contain only letters">
<input type="email" id="email" placeholder="Email Address" required>
<div class="pw"><input type="password" id="password" placeholder="Password (min 6 characters)" minlength="6" required><button type="button" class="eye" aria-label="Show password">👁️</button></div>
<div class="pw"><input type="password" id="confirm" placeholder="Confirm Password" required><button type="button" class="eye" aria-label="Show password">👁️</button></div>
<input type="text" id="skills" placeholder="Skills (comma separated)">
<input type="text" id="interests" placeholder="Interests (comma separated)">
<button type="submit" id="btn">Register</button>
<div id="msg"></div>
</form>
<p>Already have an account? <a href="login.html">Login</a></p>
</div>

<script type="module">
import { registerUser, loginUser } from './auth.js';
import { supabase } from './supabase-config.js';

// Already signed in? Skip registration and go to the app.
supabase.auth.getSession().then(({ data }) => {
  if (data.session) window.location.href = 'dashboard.html';
});

const form = document.getElementById('regForm');
const msg = document.getElementById('msg');
const btn = document.getElementById('btn');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  msg.textContent = '';
  if (password.value !== confirm.value) { msg.textContent = 'Passwords do not match.'; return; }
  btn.disabled = true;
  const { data, error } = await registerUser({
    fullName: fullName.value.trim(),
    email: email.value.trim(),
    password: password.value,
    skills: skills.value,
    interests: interests.value,
  });
  btn.disabled = false;
  if (error) { msg.textContent = error.message; return; }
  if (data.session) { window.location.href = 'dashboard.html'; return; }

  // No session returned: sign in right away with the same credentials
  const login = await loginUser(email.value.trim(), password.value);
  if (!login.error) { window.location.href = 'dashboard.html'; return; }

  msg.textContent = login.error.message.toLowerCase().includes('confirm')
    ? 'Email confirmation is still turned on in Supabase. Turn off "Confirm email" in Authentication settings.'
    : login.error.message;
});

// Show / hide password
document.querySelectorAll('.eye').forEach((b) => {
  b.addEventListener('click', () => {
    const input = b.parentElement.querySelector('input');
    const show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    b.textContent = show ? '🙈' : '👁️';
    b.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
  });
});
</script>
</body>
</html>
