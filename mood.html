<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Talentvora | Mood Zone</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f6fb;
}

header{
background:#6A0DAD;
color:white;
padding:15px 30px;
display:flex;
justify-content:space-between;
align-items:center;
}

header h2{
font-size:30px;
}

nav a{
color:white;
text-decoration:none;
margin-left:20px;
font-weight:bold;
}

nav a:hover{
color:yellow;
}

.container{
width:90%;
max-width:900px;
margin:40px auto;
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.2);
}

h1{
text-align:center;
color:#6A0DAD;
margin-bottom:25px;
}

.moods{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;
margin-bottom:30px;
}

.mood{
background:#f8f8f8;
padding:20px;
text-align:center;
border-radius:10px;
cursor:pointer;
font-size:20px;
font-weight:bold;
transition:.3s;
}

.mood:hover{
background:#6A0DAD;
color:white;
}

textarea{
width:100%;
height:120px;
padding:15px;
border-radius:10px;
border:1px solid #ccc;
font-size:16px;
margin-top:20px;
}

button{
margin-top:20px;
padding:12px 25px;
background:#6A0DAD;
color:white;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#4B0082;
}

.menu{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
gap:15px;
margin-top:40px;
}

.menu a{
background:#6A0DAD;
color:white;
text-decoration:none;
padding:15px;
text-align:center;
border-radius:10px;
font-weight:bold;
}

.menu a:hover{
background:#4B0082;
}

footer{
background:#6A0DAD;
color:white;
text-align:center;
padding:20px;
margin-top:40px;
}

</style>

<script>

function postMood(){
alert("😊 Your mood has been posted successfully!");
}

</script>

</head>

<body>

<header>

<h2>Talentvora</h2>

<nav>

<a href="dashboard.html">Dashboard</a>
<a href="homefeed.html">Home Feed</a>
<a href="profile.html">Profile</a>
<a href="index.html">Logout</a>

</nav>

</header>

<div class="container">

<h1>😊 Mood Zone</h1>

<div class="moods">

<div class="mood">😊 Happy</div>

<div class="mood">😢 Sad</div>

<div class="mood">😩 Stressed</div>

<div class="mood">😎 Motivated</div>

<div class="mood">😴 Sleepy</div>

<div class="mood">🤩 Excited</div>

</div>

<textarea placeholder="How are you feeling today?"></textarea>

<br>

<button onclick="postMood()">Post Mood</button>

<a href="admin.html">👨‍💼 Admin Panel</a>

</div>

</div>

<footer>

<p>© 2026 Talentvora | Mood Zone</p>

</footer>

</body>
</html>
