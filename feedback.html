<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Talentvora | Feedback</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#f4f6fb;
}

header{
background:#6A0DAD;
color:white;
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 30px;
}

header h2{
font-size:30px;
}

nav a{
color:white;
text-decoration:none;
margin-left:20px;
font-weight:bold;
}

nav a:hover{
color:yellow;
}

.hero{
background:linear-gradient(to right,#6A0DAD,#9B59B6);
color:white;
text-align:center;
padding:50px;
}

.hero h1{
font-size:42px;
}

.hero p{
margin-top:10px;
font-size:18px;
}

.container{
width:90%;
max-width:700px;
margin:40px auto;
background:white;
padding:30px;
border-radius:15px;
box-shadow:0px 5px 15px rgba(0,0,0,0.2);
}

label{
display:block;
margin-top:15px;
font-weight:bold;
color:#6A0DAD;
}

input, textarea, select{
width:100%;
padding:12px;
margin-top:8px;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}

textarea{
height:150px;
resize:none;
}

button{
margin-top:20px;
width:100%;
padding:15px;
background:#6A0DAD;
color:white;
border:none;
border-radius:8px;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#4B0082;
}

.menu{
margin-top:40px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:15px;
}

.menu a{
background:#6A0DAD;
color:white;
text-decoration:none;
padding:15px;
text-align:center;
border-radius:10px;
font-weight:bold;
}

.menu a:hover{
background:#4B0082;
}

footer{
margin-top:40px;
background:#6A0DAD;
color:white;
text-align:center;
padding:20px;
}

</style>

<script>

function submitFeedback(){

let name=document.getElementById("name").value;
let feedback=document.getElementById("feedback").value;

if(name=="" || feedback==""){
alert("Please fill all required fields.");
return;
}

alert("✅ Thank you, " + name + "! Your feedback has been submitted successfully.");

document.getElementById("feedbackForm").reset();

}

</script>

</head>

<body>

<header>

<h2>Talentvora</h2>

<nav>

<a href="dashboard.html">Dashboard</a>
<a href="homefeed.html">Home Feed</a>
<a href="profile.html">Profile</a>
<a href="about.html">About</a>
<a href="index.html">Logout</a>

</nav>

</header>

<section class="hero">

<h1>💬 Feedback</h1>

<p>Your suggestions help us improve Talentvora.</p>

</section>

<div class="container">

<form id="feedbackForm">

<label>Full Name</label>
<input type="text" id="name" placeholder="Enter your name" required>

<label>Email</label>
<input type="email" placeholder="Enter your email">

<label>Feedback Type</label>

<select>
<option>Suggestion</option>
<option>Complaint</option>
<option>Bug Report</option>
<option>Appreciation</option>
</select>

<label>Rating</label>

<select>
<option>⭐⭐⭐⭐⭐ Excellent</option>
<option>⭐⭐⭐⭐ Very Good</option>
<option>⭐⭐⭐ Good</option>
<option>⭐⭐ Average</option>
<option>⭐ Poor</option>
</select>

<label>Your Feedback</label>

<textarea id="feedback" placeholder="Write your feedback here..." required></textarea>

<button type="button" onclick="submitFeedback()">
Submit Feedback
</button>

</form>

<div class="menu">

<a href="dashboard.html">🏠 Dashboard</a>

<a href="learning.html">📚 Learning Hub</a>

<a href="talent.html">🎨 Talent</a>

<a href="community.html">👥 Community</a>

<a href="chat.html">💬 Messaging</a>

<a href="notifications.html">🔔 Notifications</a>

</div>

</div>

<footer>

<p>© 2026 Talentvora | Feedback Page</p>

</footer>

</body>
</html>
